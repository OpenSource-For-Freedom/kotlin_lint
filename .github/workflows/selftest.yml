name: Self-test

# Lints samples/kotlin_actions (must be clean) and samples/violations (must be
# flagged), then publishes the Markdown report as the job summary. Runs the exact
# script a developer runs locally: ./scripts/selftest.sh
on:
  push:
    branches: [Primary]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pinned lint engines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kotlin-lint/tools
          key: kotlin-lint-tools-${{ hashFiles('scripts/selftest.sh') }}

      - name: Run self-test
        shell: bash
        run: ./scripts/selftest.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-report-${{ matrix.os }}
          path: selftest-report.md
