name: Self-test

# Lints samples/kotlin_actions (must be clean) and samples/violations (must be
# flagged), then publishes the Markdown report as the job summary. Runs the exact
# script a developer runs locally: ./scripts/selftest.sh
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pinned lint engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/kotlin-lint/tools
          key: kotlin-lint-tools-${{ hashFiles('scripts/selftest.sh') }}

      - name: Run self-test
        shell: bash
        run: ./scripts/selftest.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report-${{ matrix.os }}
          path: selftest-report.md
